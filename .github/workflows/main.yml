name: Build GNU Make for Android

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - { abi: arm64-v8a, triple: aarch64-linux-android, api: 21 }
          - { abi: armeabi-v7a, triple: armv7a-linux-androideabi, api: 21 }
          - { abi: x86_64, triple: x86_64-linux-android, api: 21 }
          - { abi: x86, triple: i686-linux-android, api: 21 }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27d
        add-to-path: true

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          autopoint \
          texinfo \
          gettext \
          pkg-config \
          libtool

    - name: Bootstrap (host build first)
      run: |
        ./bootstrap
        ./configure
        make -j$(nproc)
        sudo make install
        make distclean || make clean

    - name: Patch for Android (bionic compatibility)
      run: |
        # Patch findprog-in.c - replace eaccess with access
        sed -i 's/eaccess/access/g' lib/findprog-in.c
        
        # Patch glob.c - replace mempcpy with memcpy equivalent
        sed -i 's/alt_start = mempcpy (onealt, pattern, begin - pattern);/memcpy(onealt, pattern, begin - pattern); alt_start = onealt + (begin - pattern);/g' lib/glob.c
        
        # Patch fnmatch.c - remove conflicting getenv declaration
        sed -i '/^extern char \*getenv ();/d' lib/fnmatch.c

    - name: Configure for Android
      run: |
        export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        export CC="$TOOLCHAIN/bin/${{ matrix.arch.triple }}${{ matrix.arch.api }}-clang"
        export CXX="$TOOLCHAIN/bin/${{ matrix.arch.triple }}${{ matrix.arch.api }}-clang++"
        export AR="$TOOLCHAIN/bin/llvm-ar"
        export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
        export STRIP="$TOOLCHAIN/bin/llvm-strip"
        
        # Remove GCC-specific flags that clang doesn't support
        export CFLAGS="-O2 -DANDROID_BUILD -fPIC -ffunction-sections -fdata-sections -Wno-deprecated-non-prototype"
        export LDFLAGS="-shared \
          -Wl,-soname,libmake-android.so \
          -Wl,--gc-sections \
          -Wl,-z,max-page-size=16384 \
          -Wl,-z,common-page-size=16384 \
          -Wl,--hash-style=gnu"
        
        ./bootstrap
        
        # Disable maintainer mode to avoid -Werror and -C flags
        ./configure \
          --host=${{ matrix.arch.triple }} \
          --disable-nls \
          --without-guile \
          --disable-maintainer-mode \
          ac_cv_func_eaccess=no \
          ac_cv_func_mempcpy=no \
          CFLAGS="$CFLAGS" \
          LDFLAGS="$LDFLAGS"

    - name: Patch Makefile (remove clang-incompatible flags)
      run: |
        # Remove -C flag (GCC preprocessor flag not supported by clang)
        sed -i 's/ -C / /g' Makefile
        sed -i 's/ -Wlogical-op / /g' Makefile
        sed -i 's/ -Wduplicated-cond / /g' Makefile
        sed -i 's/ -Wformat-signedness / /g' Makefile
        
        # Also remove from src/Makefile if it exists
        if [ -f src/Makefile ]; then
          sed -i 's/ -C / /g' src/Makefile
          sed -i 's/ -Wlogical-op / /g' src/Makefile
          sed -i 's/ -Wduplicated-cond / /g' src/Makefile
          sed -i 's/ -Wformat-signedness / /g' src/Makefile
        fi

    - name: Build
      run: |
        export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        export CC="$TOOLCHAIN/bin/${{ matrix.arch.triple }}${{ matrix.arch.api }}-clang"
        export AR="$TOOLCHAIN/bin/llvm-ar"
        export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
        
        make -j$(nproc) V=1
        
        echo "Building shared library..."
        cd src
        
        # Collect all object files
        OBJS=$(ls *.o 2>/dev/null || echo "")
        if [ -z "$OBJS" ]; then
          echo "ERROR: No object files found!"
          exit 1
        fi
        
        $CC -shared -o libmake-android.so \
          *.o ../lib/libgnu.a \
          -Wl,-soname,libmake-android.so \
          -Wl,--gc-sections \
          -Wl,-z,max-page-size=16384 \
          -Wl,-z,common-page-size=16384 \
          -Wl,--hash-style=gnu \
          -Wl,--build-id=sha1 \
          -lm -ldl -llog
        
        cd ..

    - name: Verify and strip
      run: |
        export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        
        mkdir -p output/${{ matrix.arch.abi }}
        
        echo "Checking page alignment..."
        $TOOLCHAIN/bin/llvm-readelf -l src/libmake-android.so | grep LOAD || true
        
        echo "Checking exported symbols..."
        $TOOLCHAIN/bin/llvm-nm -D src/libmake-android.so | grep make_android_main
        
        if [ $? -ne 0 ]; then
          echo "ERROR: make_android_main not exported!"
          echo "All exported symbols:"
          $TOOLCHAIN/bin/llvm-nm -D src/libmake-android.so
          exit 1
        fi
        
        cp src/libmake-android.so output/${{ matrix.arch.abi }}/
        $TOOLCHAIN/bin/llvm-strip output/${{ matrix.arch.abi }}/libmake-android.so
        
        echo "Final library info:"
        ls -lh output/${{ matrix.arch.abi }}/
        file output/${{ matrix.arch.abi }}/libmake-android.so

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libmake-android-${{ matrix.arch.abi }}
        path: output/${{ matrix.arch.abi }}/libmake-android.so

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release package
      run: |
        mkdir -p release/jniLibs/{arm64-v8a,armeabi-v7a,x86_64,x86}
        
        cp artifacts/libmake-android-arm64-v8a/libmake-android.so release/jniLibs/arm64-v8a/
        cp artifacts/libmake-android-armeabi-v7a/libmake-android.so release/jniLibs/armeabi-v7a/
        cp artifacts/libmake-android-x86_64/libmake-android.so release/jniLibs/x86_64/
        cp artifacts/libmake-android-x86/libmake-android.so release/jniLibs/x86/
        
        cd release
        tar -czf ../libmake-android-all.tar.gz jniLibs/
        cd ..
        
        echo "### Build Summary" > summary.txt
        echo "" >> summary.txt
        for arch in arm64-v8a armeabi-v7a x86_64 x86; do
          size=$(stat -c%s "release/jniLibs/$arch/libmake-android.so" 2>/dev/null || echo "0")
          size_mb=$(echo "scale=2; $size/1024/1024" | bc)
          echo "- $arch: ${size_mb}MB ($size bytes)" >> summary.txt
        done
        
        cat summary.txt

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: libmake-android-all-architectures
        path: |
          libmake-android-all.tar.gz
          summary.txt
